name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: PHP syntax check
        run: |
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
        run: |
          set -euo pipefail
          missing_secrets=()
          test -n "${WASMER_TOKEN:-}" || missing_secrets+=("WASMER_TOKEN")
          test -n "${WASMER_OWNER:-}" || missing_secrets+=("WASMER_OWNER")
          test -n "${WASMER_APP_NAME:-}" || missing_secrets+=("WASMER_APP_NAME")
          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::Missing GitHub secrets: ${missing_secrets[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          sed -i "s/replace-with-your-app-name/${WASMER_APP_NAME}/g" app.yaml
          sed -i "s/replace-with-your-wasmer-owner/${WASMER_OWNER}/g" app.yaml
          if grep -q "replace-with-your-" app.yaml; then
            echo "::error::app.yaml still contains deployment placeholders"
            exit 1
          fi

          wasmer --version
          wasmer deploy -v
